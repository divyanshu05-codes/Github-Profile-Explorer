<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Explorer</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/96/github.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-animation"></div>

    <div class="main">
        
        <!-- Search Section -->
        <div class="first">
            <h1 class="title">GitHub Profile Explorer</h1>
            <p class="subtitle">Search any GitHub user instantly</p>

            <div class="search-box">
                <input id="uses" class="username" type="text" placeholder="Enter GitHub username...">
                <button id="bttn" class="btn">Search</button>
            </div>
        </div>

        <!-- Profile Section -->
        <div id="two" class="second">
            <div class="default-text">
                Search a GitHub profile to view details 🚀
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
